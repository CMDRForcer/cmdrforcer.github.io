<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Signal lost — ED-Frame</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b1020'/%3E%3Cpath d='M4 4h8M4 4v8M28 4h-8M28 4v8M4 28h8M4 28v-8M28 28h-8M28 28v-8' stroke='%23ff9d5c' stroke-width='2.4' fill='none'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='none' stroke='%235ad1e6' stroke-width='2.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0b1020; --panel:#141c30; --border:#2b3550; --text:#f7f2e9;
    --text2:#d7d2c6; --muted:#8b93a8; --accent:#ff9d5c; --cyan:#5ad1e6;
    --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
    --body:"Manrope",ui-sans-serif,system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--text2); font-family:var(--body);
    padding:2rem;
    background-image:radial-gradient(ellipse 700px 400px at 50% 0%, rgba(90,209,230,.08), transparent 60%);
  }
  main{
    position:relative; max-width:32rem; width:100%; padding:2.4rem;
    background:var(--panel); border:1px solid var(--border); text-align:center;
  }
  main::before,main::after{content:"";position:absolute;width:18px;height:18px;}
  main::before{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);}
  main::after{top:-1px;right:-1px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);}
  .code{
    font-family:var(--mono); font-size:.78rem; letter-spacing:.1em; color:var(--cyan);
    text-transform:uppercase; margin-bottom:.6rem;
  }
  h1{font-family:var(--display); color:var(--text); font-size:2rem; margin:0 0 .8rem;}
  p{line-height:1.6; margin:0 0 1.6rem;}
  a.btn{
    font-family:var(--mono); font-weight:600; font-size:.85rem; letter-spacing:.03em;
    text-decoration:none; padding:.85rem 1.3rem; border-radius:3px; text-transform:uppercase;
    display:inline-block; background:var(--accent); color:#1a0f06;
  }
  a.btn:hover{background:#ffb37c;}
</style>
</head>
<body>
  <main>
    <p class="code">404 · No contact</p>
    <h1>Signal lost.</h1>
    <p>This page doesn't exist, or the link's gone stale. The console's still up though.</p>
    <a class="btn" href="/">Return to base</a>
  </main>
</body>
</html>
